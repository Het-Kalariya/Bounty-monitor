name: Telegram Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Poll Telegram commands
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT:           ${{ secrets.GH_PAT }}
        run: python bot.py

      - name: Commit updated offset
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          git add bot_offset.json
          if git diff --staged --quiet; then
            echo "No offset changes, skipping commit."
          else
            git commit -m "chore: bot offset [skip ci]"
            git pull --rebase origin main
            git push
          fi

name: Telegram Bot

# Resident bot: one long-running job long-polls Telegram (instant replies).
# The */15 schedule re-arms the next run (queued behind the active one via the
# shared concurrency group), so the bot restarts automatically if it ever dies.
# Manual "Run workflow" also sends a "Bot online" ping so you can verify liveness.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Resident bot (long-poll)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANNOUNCE:         ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          BOT_MAX_MINUTES:  '330'
        run: python bot.py

      - name: Commit updated offset
        if: always()
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          git add bot_offset.json
          if git diff --staged --quiet; then
            echo "No offset changes, skipping commit."
          else
            git commit -m "chore: bot offset [skip ci]"
            git pull --rebase origin main
            git push
          fi

name: Telegram Bot

# Resident bot: one long-running job long-polls Telegram (instant replies).
# When this run completes, "Bot Keepalive" auto-restarts it via workflow_run —
# the two workflows ping-pong forever, no cron schedules needed.
# Stop everything: disable BOTH workflows + cancel the active run.
#
# BULLETPROOF NOTES (why it used to stop daily):
# - NO concurrency group on purpose: sharing one group queued runs behind each
#   other; queued duplicates started late, hit Telegram 409, exited, and the
#   skipped/cancelled guards below broke the chain. Brief overlap is safe —
#   bot.py stays alive on 409 with backoff instead of exiting.
# - UNCONDITIONAL restart: any completed/cancelled/failure conclusion restarts
#   the partner. The old skipped/cancelled guards halted the whole chain after
#   one manual cancel. To stop the bot now, DISABLE both workflows first.
# - No schedule here: keepalive.yml owns the single dead-man schedule, so the
#   two never overlap at 03:00/03:17 and 409 each other.

on:
  workflow_dispatch:
    inputs:
      quick_test:
        description: 'Quick 5-min smoke test (auto-boots the resident chain after)'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Bot Keepalive"]
    types: [completed]

permissions:
  contents: write

jobs:
  bot:
    name: Resident bot (long-poll)
    # forks don't inherit secrets — run the resident bot only in the home
    # repo; everywhere else the job skips and the chain halts quietly
    if: github.repository_owner == 'Het-Kalariya'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout (full history — shallow clones break rebase/push)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MAX_MINUTES:  ${{ inputs.quick_test && '5' || '300' }}
        run: python -u bot.py

      - name: Commit updated offset
        if: always()
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          # tolerant adds: prefs/blocked only exist after first /digest or /block
          git add bot_offset.json || true
          git add prefs.json 2>/dev/null || true
          git add blocked.json 2>/dev/null || true
          git add vdp_store.json 2>/dev/null || true
          # inline monitor may also have produced fresh state — include it
          git add state.json changes_log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No offset changes, skipping commit."
          else
            git commit -m "chore: bot offset [skip ci]" || true
            git fetch origin main || true
            # freshest snapshot wins on conflict (bot just re-fetched upstream APIs)
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
            git push || (git fetch origin main || true; git pull --rebase --autostash -X theirs origin main || git rebase --abort || true; git push || echo "push failed — next run will retry")
          fi

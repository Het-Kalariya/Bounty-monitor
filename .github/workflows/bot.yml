name: Telegram Bot

# Resident bot: one long-running job long-polls Telegram (instant replies).
# When this run completes, "Bot Keepalive" auto-restarts it via workflow_run —
# the two workflows ping-pong forever, no cron schedules needed.
# Stop everything: disable BOTH workflows + cancel the active run.

on:
  workflow_dispatch:
    inputs:
      quick_test:
        description: 'Quick 5-min smoke test (auto-boots the resident chain after)'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Bot Keepalive"]
    types: [completed]
  schedule:
    - cron: '0 3 * * *'   # dead-man: reboot the chain daily if it ever breaks

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Resident bot (long-poll)
    # a skipped Keepalive means the previous bot run was cancelled on purpose —
    # don't resurrect the chain (manual "Run workflow" restarts it).
    # missing TELEGRAM_TOKEN (e.g. on a fork) → job skips → chain halts
    # quietly instead of crashing in a red-X loop forever
    if: >-
      secrets.TELEGRAM_TOKEN != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MAX_MINUTES:  ${{ inputs.quick_test && '5' || '330' }}
        run: python -u bot.py

      - name: Commit updated offset
        if: always()
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          # tolerant adds: prefs/blocked only exist after first /digest or /block
          git add bot_offset.json || true
          git add prefs.json 2>/dev/null || true
          git add blocked.json 2>/dev/null || true
          # inline monitor may also have produced fresh state — include it
          git add state.json changes_log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No offset changes, skipping commit."
          else
            git commit -m "chore: bot offset [skip ci]" || true
            git fetch origin main || true
            # freshest snapshot wins on conflict (bot just re-fetched upstream APIs)
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
            git push || (git fetch origin main || true; git pull --rebase --autostash -X theirs origin main || git rebase --abort || true; git push || echo "push failed — next run will retry")
          fi

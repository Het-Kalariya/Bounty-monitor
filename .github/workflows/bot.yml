name: Telegram Bot

# Resident bot: one long-running job long-polls Telegram (instant replies).
# When this run completes, "Bot Keepalive" auto-restarts it via workflow_run —
# the two workflows ping-pong forever, no cron schedules needed.
# Stop everything: disable BOTH workflows + cancel the active run.

on:
  workflow_dispatch:
    inputs:
      quick_test:
        description: 'Quick 5-min smoke test (auto-boots the resident chain after)'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Bot Keepalive"]
    types: [completed]
  schedule:
    - cron: '0 3 * * *'   # dead-man: reboot the chain daily if it ever breaks

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Resident bot (long-poll)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MAX_MINUTES:  ${{ inputs.quick_test && '5' || '330' }}
        run: python -u bot.py

      - name: Commit updated offset
        if: always()
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          git add bot_offset.json
          if git diff --staged --quiet; then
            echo "No offset changes, skipping commit."
          else
            git commit -m "chore: bot offset [skip ci]"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push) || echo "push failed — next run will retry"
          fi

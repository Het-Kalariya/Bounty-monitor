name: Bot Keepalive

# Auto-restarts the resident bot whenever a "Telegram Bot" run completes.
# The two workflows ping-pong each other via workflow_run — the bot stays
# alive 24/7 without depending on cron schedules.
# Stop everything: disable BOTH workflows + cancel the active run.

on:
  workflow_run:
    workflows: ["Telegram Bot"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'   # dead-man restart if the chain ever breaks

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  keepalive:
    name: Resident bot (keepalive)
    # a cancelled predecessor means someone stopped the bot on purpose —
    # don't restart the chain in that case.
    # forks don't inherit secrets — run the resident bot only in the home
    # repo; everywhere else the job skips and the chain halts quietly
    if: >-
      github.repository_owner == 'Het-Kalariya' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MAX_MINUTES:  '330'
        run: python -u bot.py

      - name: Commit updated offset
        if: always()
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          # tolerant adds: prefs/blocked only exist after first /digest or /block
          git add bot_offset.json || true
          git add prefs.json 2>/dev/null || true
          git add blocked.json 2>/dev/null || true
          # inline monitor may also have produced fresh state — include it
          git add state.json changes_log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No offset changes, skipping commit."
          else
            git commit -m "chore: bot offset [skip ci]" || true
            git fetch origin main || true
            # freshest snapshot wins on conflict (bot just re-fetched upstream APIs)
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
            git push || (git fetch origin main || true; git pull --rebase --autostash -X theirs origin main || git rebase --abort || true; git push || echo "push failed — next run will retry")
          fi

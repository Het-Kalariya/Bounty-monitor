name: Bug Bounty Source Code Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes, 24x7
  workflow_dispatch:           # Manual trigger from Actions tab

permissions:
  contents: write              # Needed to commit state.json back to repo

jobs:
  monitor:
    name: Run Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          # state.json is always created by the script (even on first run)
          git add state.json
          # Only push if there's actually a diff — avoids empty commits
          if git diff --staged --quiet; then
            echo "No state changes, skipping commit."
          else
            git commit -m "chore: update state [skip ci]"
            git push
          fi
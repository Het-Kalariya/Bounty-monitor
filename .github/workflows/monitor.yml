name: Bug Bounty Source Code Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Run Monitor
    # forks don't inherit secrets — run the monitor only in the home repo;
    # everywhere else skip (no mute monitor committing tokenless state)
    if: github.repository_owner == 'Het-Kalariya'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout (full history — shallow clones break rebase/push)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_BUDGET_SEC: '600'
        run: python monitor.py

      - name: Commit updated state
        # MUST run even when monitor times out/fails: otherwise the fresh
        # state.json it did manage to write is lost and the next run repeats
        # everything (this lost data daily before).
        if: always()
        run: |
          git config user.name  "BountyBot[bot]"
          git config user.email "bountybot@users.noreply.github.com"
          git add state.json changes_log.json || true
          if git diff --staged --quiet; then
            echo "No state changes, skipping commit."
          else
            git commit -m "chore: update state [skip ci]" || true
            git fetch origin main || true
            git pull --rebase --autostash -X theirs origin main || git rebase --abort || true
            git push || (git fetch origin main || true; git pull --rebase --autostash -X theirs origin main || git rebase --abort || true; git push || echo "push failed — next run will retry")
          fi
